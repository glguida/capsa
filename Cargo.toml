[package]
name = "capsa"
version = "0.1.0"
edition = "2024"
authors = ["Gianluca Guida <glguida@gmail.com>"]
description = "A compact, lightweight library for embedding-based document storage and retrieval"
license = "MIT"
repository = "https://github.com/glguida/capsa"
homepage = "https://github.com/glguida/capsa"
keywords = ["vector-search", "embeddings", "rag", "retrieval", "semantic-search"]
categories = ["database", "text-processing"]
readme = "README.md"

[[bin]]
name = "capsa"
path = "bin/capsa.rs"

[[bench]]
name = "compression_benchmark"
path = "benches/compression_benchmark.rs"
harness = false

[dependencies]
anyhow = "1.0.100"
async-openai = { version = "0.32.2", features = ["embedding"] }
async-trait = "0.1"
tokio = { version = "1.48.0", features = ["full"] }
text-splitter = { version = "0.28", features = ["tokenizers"] }
tokenizers = { version = "0.22", features = ["http"] }
stream = "0.1.0"
futures = "0.3.31"
lopdf = "0.34"
libsql = "0.9.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.148"
clap = { version = "4.5", features = ["derive"] }
lru = "0.12"
yt-transcript-rs = "0.1.8"
thiserror = "2.0"
secrecy = "0.10.3"
lz4_flex = { version = "0.11", features = ["frame"] }
rayon = "1"
rmcp = { version = "1.1.0", features = ["server", "macros", "transport-streamable-http-server"] }
axum = { version = "0.8", features = ["http1", "tokio"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.0"


