# GitHub Actions workflow: CI for Rust project
# Runs on push and pull_request: build, test (includes doctests), lint, and build docs.
# Uploads generated HTML docs as an artifact for PR review.
on:
  push:
  pull_request:

jobs:
  ci:
    name: Build, test, lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (debug)
        run: cargo build --workspace --verbose

      - name: Run tests (includes doctests)
        run: cargo test --workspace --verbose

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  docs:
    name: Build docs and upload artifact
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build docs
        run: cargo doc --no-deps --workspace --verbose

      - name: Upload docs artifact
        uses: actions/upload-artifact@v3
        with:
          name: rust-docs
          path: target/doc